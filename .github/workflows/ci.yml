name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_sweep:
        description: "Also run the full Latin-hypercube sweep (configs/full.toml)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: make lint
      - run: make test

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  sweep:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Smoke sweep
        run: make smoke
      - name: Physics regression check against golden metrics
        run: make golden
      - name: Export JSON for the UI
        run: make export
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            results/
            ui/public/data/

  full-sweep:
    if: github.event_name == 'workflow_dispatch' && inputs.full_sweep
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: rksweep sweep configs/full.toml --out results-full/
      - uses: actions/upload-artifact@v4
        with:
          name: full-results
          path: results-full/

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [sweep, ui]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: smoke-results
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci && npm run build
        working-directory: ui
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist
      - id: deploy
        uses: actions/deploy-pages@v4
