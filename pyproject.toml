[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rksweep"
version = "0.1.0"
description = "Educational point-kinetics reactor model with parameter sweeps, Parquet storage and a compare UI."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "jwwoody" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
    "pyarrow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "ruff==0.17.5",
    "mypy==2.4.1",
    "duckdb",
]
hdf5 = ["h5py"]
plot = ["matplotlib"]

[project.scripts]
rksweep = "rksweep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "N", "PT"]
ignore = [
    "N803",  # capital A / C are the standard matrix and precursor names in this domain
    "N806",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["rksweep"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/rksweep"]

[[tool.mypy.overrides]]
module = ["scipy.*", "pyarrow.*", "h5py.*", "duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["rksweep"]
branch = true
